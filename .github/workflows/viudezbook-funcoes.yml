name: Viudezbook - publicar funções no Supabase

# Roda sozinho quando as funções mudam na main, ou na mão pelo botão "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["viudezbook/supabase/functions/**"]

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: viudezbook } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run build

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: viudezbook } }
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJETO: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase functions deploy preparar-texto --project-ref "$PROJETO"
      - run: supabase functions deploy coletar-livro --project-ref "$PROJETO"
      - run: supabase functions deploy gerar-voz --project-ref "$PROJETO"
      - run: supabase functions deploy resumir --project-ref "$PROJETO"
